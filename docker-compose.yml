services:
  curator:
    build: .
    container_name: synapse_curator
    restart: unless-stopped
    volumes:
      - /mnt/nas_data:/mnt/nas_data
    env_file:
      - .env
    ports:
      - "8001:8001"

  ingest-api:
    build: .
    container_name: synapse_ingest_api
    restart: unless-stopped
    volumes:
      - /mnt/nas_data:/mnt/nas_data
    env_file:
      - .env
    command: ["uvicorn", "src.ingest_api:app", "--host", "0.0.0.0", "--port", "8000"]
    # Deliberately not published to the host. Kong reaches this over the compose
    # network as http://ingest-api:8000 (config/kong.yml), so the mapping was never
    # needed to serve traffic — and publishing it let clients reach the ingest API
    # directly, bypassing the gateway that exists to authenticate them.
    #
    # It also collided: aadyon-assist already binds host port 8000 on this machine,
    # so the bind failed, `compose up` aborted, and both this container and the
    # gateway were left in state "created" with empty logs — a port conflict is
    # reported by the daemon at start time and never reaches the container log,
    # which makes it look like nothing happened at all.
    expose:
      - "8000"

  gateway:
    image: kong:3.9
    container_name: synapse_gateway
    restart: unless-stopped
    # Kong resolves {vault://env/api-key} in config/kong.yml from API_KEY here.
    env_file:
      - .env
    environment:
      - KONG_DATABASE=off
      - KONG_DECLARATIVE_CONFIG=/kong/declarative/kong.yml
      - KONG_PROXY_ACCESS_LOG=/dev/stdout
      - KONG_ADMIN_ACCESS_LOG=/dev/stdout
      - KONG_PROXY_ERROR_LOG=/dev/stderr
      - KONG_ADMIN_ERROR_LOG=/dev/stderr
    volumes:
      - ./config/kong.yml:/kong/declarative/kong.yml
    ports:
      - "80:8000"
      # 443 is deliberately not published. tailscaled already owns it on this host:
      # `tailscale serve` terminates real HTTPS at
      # https://macminilinuxserver.tailcab499.ts.net and proxies to 127.0.0.1:8000.
      # Kong binding 0.0.0.0:443 collides with that specific-address bind and the
      # container fails to start with "address already in use", taking the whole
      # gateway down — which is what happened.
      #
      # Nothing is lost: no TLS certificate is configured here, so Kong's 8443 would
      # only ever present a self-signed cert. Clients reach the ingest route over
      # http on port 80, and anything wanting HTTPS should go through Tailscale
      # Serve, which has a real certificate.

  prometheus:
    image: prom/prometheus
    container_name: synapse_prometheus
    restart: unless-stopped
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana-oss
    container_name: synapse_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin

  ollama:
    image: ollama/ollama:latest
    container_name: synapse_ollama
    restart: unless-stopped
    volumes:
      - /mnt/nas_data/ollama:/root/.ollama
    ports:
      - "11434:11434"
